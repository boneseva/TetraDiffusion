num_workers: 7  # cpus-per-task(8) - 1 main process = 7; avoids CPU starvation warning
load_weights: False
use_local_sgd: False

# Training params
training:
  batch_size: 4
  ga: 1
  ema_decay: 0.995
  lr: 1.4e-4
  num_steps: 400000
  test_every: 500
  lr_schedule: warmup_constant
  warmup_steps: 2000        # steps for linear ramp  (ignored for constant / cosine)
  lr_min: 1e-6              # floor LR for cosine schedules
  mixed_precision: False

network:
  GC: [True,True,True,True,True] # where to use gradinet checkpointing
  width: 128
  vit_depth: 4
  num_blocks: [2 , 2, 2 , 2 , 2] # [1 , 1, 2, 2 , 2] # num of res blocks per level
  channel_multiplier: [1, 1, 1, 4, 8] # [1, 1, 4, 8, 8] #[1, 1, 4, 8, 12] # multiplied by width
  dropout: [0.0, 0.0, 0.0, 0.1, 0.1] # dropout per stage
  downsample: [True,True,True,True,False] #defines when downsample is happening
  upsample: [False,True,True,True,True] #defines when upsample is happening
  attentions: [False, False, False, False, True] # defines where to place self-attention (left is highest resolution)
  linear_attentions: [True, True, True, True, False] # defines where to place self-attention (left is highest resolution)
  learned_sinusoidal_cond: True
  learned_sinusoidal_dim: 1024
  use_group_norm: True #else uses RMSNorm
  group_norm_groups: 32 # number of groups per to normalize
  add_coords: False

# Diffusion params
diffusion:
  offset_noise: 0.1   # was 0.0 — offset noise helps prevent mean-collapse on small datasets
  noise_d: 32
  use_standard_noise: False
  pred_objective: "v" # "v" or "eps"
  sampling_steps: [32,32,64,64]

  # Biological constraint losses (dissertation proposal section 2.2 / 3.1)
  # Set bio_loss_weight > 0 to enable.  Start small (1e-3) and increase if
  # generated shapes become rough or biologically implausible.
  bio_loss_weight: 0.005        # λ — overall weight of biological constraint term
  bio_loss_type: "both"         # "laplacian" | "curvature" | "both"
  snr_gate: "soft"              # "soft" | "hard_0.3" | "hard_0.5" | "hard_0.7" | "none"
  bio_curvature_softness: 0.15  # width of surface weighting kernel exp(-|sdf|/σ)

  # Eikonal regularisation — penalises |∇φ|² deviating from 1 on the predicted
  # clean SDF.  Protects the curvature approximation H ≈ −Δφ when the model's
  # prediction is not a perfect SDF.  Requires tet_verts to be available (ds).
  # Set to 0.0 to disable (default); typical values: 1e-3 – 1e-2.
  bio_eikonal_weight: 0.0       # weight for Eikonal loss (0 = disabled)

  # Surface-weighted SDF background loss — fixes multi-component generation.
  # See docs/sdf_background_loss.md for full explanation and ablation guidance.
  sdf_bg_loss_weight: 0.0       # weight for SDF background loss (0 = disabled)
  sdf_bg_threshold: 0.3         # normalised SDF threshold for background (0.2–0.5)

# Dataset params
dataset:
  grid_res: 128
  shapenet_ids: ["02691156"] # Airplane
  data_path: "./data/preprocessed/"
  num_samples: 10000
  mask_data: False
  grid_pruning: True
  sdf_masking_value: 0.2
  deform_masking_value: 0.0
  mask_lossy: True
  threshold: 10
  color: False # 3D mesh without color attributes

# 2D Image Conditioning params (disabled by default)
image_cond:
  enabled: False
  proj_size: 64
  embed_dim: 1024
  cfg_guidance_scale: 1.5
